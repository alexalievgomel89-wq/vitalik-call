<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#0E0D12" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Виталик" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<title>Позвонить Виталику</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
  :root{
    --bg:#0E0D12; --bg2:#17151D; --ink:#F4F1EA; --muted:#A39D93; --line:rgba(255,255,255,.08);
    --chip:rgba(255,255,255,.06); --chip-hover:rgba(255,255,255,.11);
    --accent:#FF5A3C; --accent-ink:#fff; --accent-soft:rgba(255,90,60,.16);
    --go:#2BD47D; --end:#FF3B4A; --me:#24222B;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#F3F1EC; --bg2:#FFFFFF; --ink:#18161D; --muted:#6C665E; --line:rgba(0,0,0,.08);
      --chip:rgba(0,0,0,.05); --chip-hover:rgba(0,0,0,.09); --accent-soft:rgba(255,90,60,.12); --me:#E6E2DA; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.45 "Golos Text",-apple-system,system-ui,sans-serif;
    min-height:100dvh; overflow:hidden;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .app{
    position:relative; height:100dvh; max-width:520px; margin:0 auto;
    display:grid; grid-template-rows:auto 1fr auto auto; grid-template-columns:minmax(0,1fr);
    padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  /* фон: тёплое свечение под шаром */
  .glow{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(60% 42% at 50% 30%, var(--accent-soft), transparent 70%)}
  .app>*{position:relative;z-index:1;min-width:0}

  /* верх */
  header{display:flex;align-items:center;justify-content:space-between;height:44px}
  .brand{font:700 17px/1 Unbounded,sans-serif;letter-spacing:-.02em}
  .pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;
    background:var(--chip);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background .3s,color .3s}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .pill.live{color:var(--ink)} .pill.live .dot{background:var(--go);animation:ping 1.8s infinite}
  .pill.tool{color:var(--ink)} .pill.tool .dot{background:var(--accent)}

  /* сцена: шар + приветствие + субтитры */
  .stage{display:grid;grid-template-rows:auto auto 1fr;min-height:0;justify-items:center}
  .orb-wrap{position:relative;width:min(78vw,340px);aspect-ratio:1;margin-top:2vh;transition:width .6s var(--ease)}
  .app.incall .orb-wrap{width:min(46vw,210px)}
  canvas#orb{width:100%;height:100%;display:block}
  .face{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(40px,12vw,64px)/1 Unbounded,sans-serif;
    color:rgba(255,255,255,.92);letter-spacing:-.04em;pointer-events:none;transition:opacity .4s,transform .6s var(--ease)}
  .app.incall .face{opacity:0;transform:scale(.8)}
  .hello{text-align:center;margin-top:18px}
  .hello h1{font:700 clamp(26px,7.4vw,34px)/1.1 Unbounded,sans-serif;letter-spacing:-.03em;margin:0}
  .hello p{margin:8px auto 0;color:var(--muted);max-width:30ch;min-height:22px}
  .app.incall .hello h1{display:none}
  .app.incall .hello{margin-top:10px}
  .feed{scrollbar-width:none} .feed::-webkit-scrollbar{display:none}

  .feed{width:100%;min-height:0;overflow-y:auto;margin-top:14px;padding:6px 2px 10px;
    display:flex;flex-direction:column;gap:8px;
    mask-image:linear-gradient(to bottom,transparent 0,#000 28px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
  .feed:empty{display:none}
  .b{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.4;animation:rise .45s var(--ease) both;overflow-wrap:anywhere}
  .b.ai{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);border-bottom-left-radius:6px}
  .b.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:6px}
  .b.partial{opacity:.6}
  .b.sys{align-self:center;background:none;color:var(--muted);font-size:13.5px;padding:2px 8px;display:flex;gap:6px;align-items:center}
  .b.sys i{color:var(--accent)}

  /* быстрые команды */
  .chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scroll-padding-inline:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;
    background:var(--chip);font-size:15px;font-weight:500;white-space:nowrap;transition:background .2s,transform .15s var(--ease)}
  .chip i{font-size:18px;color:var(--accent)}
  .chip:hover{background:var(--chip-hover)} .chip:active{transform:scale(.96)}

  /* ввод текстом во время звонка */
  .say{display:none;gap:8px;margin-bottom:12px}
  .app.incall .say{display:flex}
  .say input{flex:1;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);
    padding:0 18px;font:inherit;font-size:16px;outline:none}
  .say input::placeholder{color:var(--muted)}
  .say input:focus{border-color:var(--accent)}
  .say button{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:20px}

  /* кнопки */
  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .round{width:58px;height:58px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:24px;
    transition:background .2s,transform .15s var(--ease),opacity .3s}
  .round:active{transform:scale(.94)}
  .round[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
  .round:disabled{opacity:0;pointer-events:none}
  .controls .left{justify-self:start} .controls .right{justify-self:end}
  .call{height:72px;min-width:72px;padding:0 30px;border-radius:999px;background:var(--go);color:#06210F;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:18px;
    box-shadow:0 14px 34px -14px rgba(43,212,125,.7);transition:background .3s,box-shadow .3s,transform .15s var(--ease),padding .4s var(--ease)}
  .call i{font-size:28px;transition:transform .4s var(--ease)}
  .call:active{transform:scale(.96)}
  .call.end{background:var(--end);color:#fff;padding:0;width:72px;box-shadow:0 14px 34px -14px rgba(255,59,74,.7)}
  .call.end span{display:none}
  .call.end i{transform:rotate(135deg)}
  .call:disabled{opacity:.55;cursor:default}
  .call.wait i{animation:spin 1s linear infinite}

  .note{margin-top:10px;text-align:center;font-size:13px;color:var(--muted);min-height:18px}

  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,212,125,.45)}80%,100%{box-shadow:0 0 0 9px rgba(43,212,125,0)}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media (min-height:760px){ .orb-wrap{margin-top:5vh} }
</style>
</head>
<body>
<div class="glow"></div>
<main class="app" id="app">
  <header>
    <div class="brand">Виталик</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="pillText">На связи 24/7</span></div>
  </header>

  <section class="stage">
    <div class="orb-wrap">
      <canvas id="orb" aria-hidden="true"></canvas>
      <div class="face" aria-hidden="true">В</div>
    </div>
    <div class="hello">
      <h1 id="hello">Привет, бро</h1>
      <p id="status">Пульт под рукой. Жми и говори.</p>
    </div>
    <div class="feed" id="feed" aria-live="polite"></div>
  </section>

  <div>
    <div class="chips" id="chips">
      <button class="chip" data-q="Дай сводку по ВК за сегодня: сколько потратили, сколько пришло, окупаемость"><i class="ph ph-chart-line-up"></i>Сводка за сегодня</button>
      <button class="chip" data-q="Как дела у детей сегодня? Кто лучше всех, кто хуже"><i class="ph ph-heart"></i>Как дети</button>
      <button class="chip" data-q="Какие группы сегодня хуже всех, что жрут без отдачи?"><i class="ph ph-trend-down"></i>Кто сливает</button>
      <button class="chip" data-q="Какие группы сегодня лучшие?"><i class="ph ph-fire"></i>Кто рулит</button>
      <button class="chip" data-q="Что последним делал автопилот?"><i class="ph ph-robot"></i>Автопилот</button>
      <button class="chip" data-q="Как было вчера по ВК, сводка за вчера"><i class="ph ph-calendar-blank"></i>Вчера</button>
    </div>
    <form class="say" id="say" autocomplete="off">
      <input id="sayInput" type="text" enterkeyhint="send" placeholder="Написать Виталику…" aria-label="Сообщение Виталику" />
      <button type="submit" aria-label="Отправить"><i class="ph-fill ph-paper-plane-tilt"></i></button>
    </form>
  </div>

  <div>
    <div class="controls">
      <button class="round left" id="muteBtn" aria-pressed="false" aria-label="Выключить микрофон" disabled><i class="ph ph-microphone"></i></button>
      <button class="call" id="callBtn" aria-label="Позвонить"><i class="ph-fill ph-phone"></i><span>Позвонить</span></button>
      <button class="round right" id="clearBtn" aria-label="Очистить переписку" disabled><i class="ph ph-broom"></i></button>
    </div>
    <div class="note" id="note"></div>
  </div>
</main>

<script type="module">
  import Vapi from "./lib/web.bundle.mjs";

  // Ключ Vapi и id ассистента зашифрованы. Расшифровываются ключом из личной ссылки (#k=…), ключ запоминается на телефоне.
  // Хвост #k= оставляем в адресе: так «На экран Домой» сохранит рабочую ссылку.
  const ENC = {"s":"aOkokINNwbyE0i4ltsJ6XQ==","i":"D8qjxT83Qqxcjm/G","c":"JAY9GP2r7OHpCAH2b3LQrNettXxRqsredA/kk91PEYwsuNVKUuFOnjFayIqbBeJoILZdS092Ny2GpRCqokwF1zTKtgiFXBPUMdVdW+5bOg7DW+ePD4maRFT98zAbG6/TS3cRCzPyBgQ="};

  const $ = id => document.getElementById(id);
  const app = $("app"), btn = $("callBtn"), muteBtn = $("muteBtn"), clearBtn = $("clearBtn");
  const feed = $("feed"), statusEl = $("status"), note = $("note"), pill = $("pill"), pillText = $("pillText");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));

  // приветствие по времени суток
  const h = new Date().getHours();
  $("hello").textContent = h < 5 ? "Не спится, бро?" : h < 12 ? "Доброе утро, бро" : h < 18 ? "Здорово, бро" : "Добрый вечер, бро";

  // ------------------------------------------------------------ живой шар (реагирует на голос)
  const cv = $("orb"), ctx = cv.getContext("2d");
  let level = 0, target = 0, mode = "idle";
  const t0 = performance.now();
  function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; if (reduce) draw(performance.now()); }
  const COLORS = { idle: ["#FF8A5B", "#FF5A3C", "#C2263B"], connecting: ["#FFC36B", "#FF8A3C", "#D2453A"],
                   listen: ["#7BE3A8", "#2BD47D", "#138A55"], speak: ["#FFB36B", "#FF5A3C", "#E0234E"], tool: ["#FFE07A", "#FFB23C", "#FF5A3C"] };
  function draw(now) {
    const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.34;
    const t = (now - t0) / 1000;
    level += (target - level) * 0.18;
    if (mode !== "speak") target *= 0.94;
    ctx.clearRect(0, 0, W, H);
    const c = COLORS[mode] || COLORS.idle;
    const halo = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * (1.55 + level * 0.5));
    halo.addColorStop(0, c[1] + "55"); halo.addColorStop(1, c[1] + "00");
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    for (let layer = 2; layer >= 0; layer--) {
      ctx.beginPath();
      const amp = R * (0.035 + level * 0.16) * (1 + layer * 0.35), sp = 0.6 + layer * 0.25 + (mode === "connecting" || mode === "tool" ? 1.4 : 0);
      for (let i = 0; i <= 96; i++) {
        const a = (i / 96) * Math.PI * 2;
        const n = Math.sin(a * 3 + t * sp * 1.7 + layer) * 0.5 + Math.sin(a * 5 - t * sp * 1.1 + layer * 2) * 0.32 + Math.sin(a * 2 + t * sp * 0.7) * 0.4;
        const r = R * (1 - layer * 0.07) + n * amp + (reduce ? 0 : Math.sin(t * 1.2) * R * 0.012);
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      const g = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.45, R * 0.1, cx, cy, R * 1.2);
      g.addColorStop(0, c[0]); g.addColorStop(0.55, c[1]); g.addColorStop(1, c[2]);
      ctx.globalAlpha = layer === 0 ? 1 : 0.28;
      ctx.fillStyle = g; ctx.fill();
    }
    ctx.globalAlpha = 1;
    const hl = ctx.createRadialGradient(cx - R * 0.38, cy - R * 0.42, 0, cx - R * 0.38, cy - R * 0.42, R * 0.7);
    hl.addColorStop(0, "rgba(255,255,255,.38)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(cx, cy, R * 0.98, 0, Math.PI * 2); ctx.fill();
  }
  function loop(now) { draw(now); requestAnimationFrame(loop); }
  new ResizeObserver(size).observe(cv); size();
  if (!reduce) requestAnimationFrame(loop);
  const setMode = m => { mode = m; if (reduce) draw(performance.now()); };

  // ------------------------------------------------------------ интерфейс
  const setStatus = t => statusEl.textContent = t;
  const setPill = (t, cls = "") => { pillText.textContent = t; pill.className = "pill " + cls; };
  const buzz = ms => { try { navigator.vibrate?.(ms); } catch (_) {} };
  let partialEl = null;
  function bubble(role, text, partial = false) {
    if (partialEl && partialEl.dataset.role === role) {
      partialEl.textContent = text;
      if (!partial) { partialEl.className = `b ${role}`; partialEl = null; }
    } else {
      const el = document.createElement("div");
      el.className = `b ${role}${partial ? " partial" : ""}`; el.dataset.role = role; el.textContent = text;
      feed.append(el); if (partial) partialEl = el;
    }
    feed.scrollTop = feed.scrollHeight;
    clearBtn.disabled = false;
  }
  function sys(icon, text) {
    const el = document.createElement("div"); el.className = "b sys";
    const i = document.createElement("i"); i.className = "ph " + icon;
    const s = document.createElement("span"); s.textContent = text;
    el.append(i, s); feed.append(el); feed.scrollTop = feed.scrollHeight; clearBtn.disabled = false; return s;
  }

  // ------------------------------------------------------------ ключ из личной ссылки
  let linkKey = new URLSearchParams(location.hash.slice(1)).get("k");
  try { if (linkKey) localStorage.setItem("vk", linkKey); else linkKey = localStorage.getItem("vk"); } catch (_) {}
  async function unlock(k) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(k), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.s), iterations: 200000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.i) }, key, b64(ENC.c))));
  }
  let cfg = null;
  if (!linkKey) { setStatus("Нужна личная ссылка от Виталика."); btn.disabled = true; }
  else {
    try { cfg = await unlock(linkKey); }
    catch (_) { setStatus("Ссылка не подходит. Попроси у Виталика новую."); btn.disabled = true; try { localStorage.removeItem("vk"); } catch (_) {} }
  }
  if (cfg && !matchMedia("(display-mode: standalone)").matches && /iPhone|iPad/.test(navigator.userAgent))
    note.textContent = "Совет: «Поделиться» → «На экран Домой», и Виталик будет как приложение";

  // ------------------------------------------------------------ звонок
  let vapi = null, live = false, connecting = false, timer = 0, started = 0, wake = null, toolEl = null;
  const pending = [];
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  const icon = cls => btn.querySelector("i").className = cls;

  function start() {
    if (!cfg || live || connecting) return;
    connecting = true; btn.disabled = true; btn.classList.add("wait"); icon("ph ph-circle-notch");
    setMode("connecting"); setStatus("Соединяю…"); setPill("Звоню");
    Promise.resolve(vapi.start(cfg.a)).then(r => { if (r === null && connecting) fail("no call"); }).catch(fail);
  }
  function fail(e) {
    const m = String(e?.error?.message || e?.errorMsg || e?.message || e || "");
    connecting = false; live = false; clearInterval(timer);
    btn.disabled = false; btn.classList.remove("wait", "end"); icon("ph-fill ph-phone");
    app.classList.remove("incall"); muteBtn.disabled = true; setMode("idle"); setPill("На связи 24/7");
    setStatus(/permission|denied|NotAllowed|device/i.test(m) ? "Нет доступа к микрофону. Разреши его в настройках Safari." : "Не соединилось. Попробуй ещё раз.");
    console.warn(e);
  }
  function send(text) {
    if (!text) return;
    if (!live) { pending.push(text); start(); return; }
    bubble("me", text);
    vapi.send({ type: "add-message", message: { role: "user", content: text }, triggerResponseEnabled: true });
  }

  if (cfg) {
    vapi = new Vapi(cfg.pk);
    btn.addEventListener("click", () => live ? vapi.stop() : start());
    vapi.on("call-start", async () => {
      connecting = false; live = true; buzz(30);
      btn.disabled = false; btn.classList.remove("wait"); btn.classList.add("end"); icon("ph-fill ph-phone");
      btn.setAttribute("aria-label", "Завершить звонок");
      app.classList.add("incall"); muteBtn.disabled = false; setMode("listen"); setStatus("Говори, я слушаю");
      started = Date.now(); setPill("00:00", "live");
      timer = setInterval(() => { if (!toolEl) setPill(fmt(Math.floor((Date.now() - started) / 1000)), "live"); }, 1000);
      try { wake = await navigator.wakeLock?.request("screen"); } catch (_) {}
      const q = pending.splice(0); if (q.length) setTimeout(() => q.forEach(send), 2600);
    });
    vapi.on("call-end", () => {
      const was = live; live = false; connecting = false; clearInterval(timer); buzz([20, 40, 20]);
      btn.classList.remove("end", "wait"); btn.disabled = false; icon("ph-fill ph-phone"); btn.setAttribute("aria-label", "Позвонить");
      app.classList.remove("incall"); muteBtn.disabled = true; muteBtn.setAttribute("aria-pressed", "false"); muteBtn.querySelector("i").className = "ph ph-microphone";
      setMode("idle"); setPill("На связи 24/7");
      setStatus(was ? `Поговорили ${fmt(Math.floor((Date.now() - started) / 1000))}. Звони ещё.` : "Звонок сорвался. Попробуй ещё раз.");
      wake?.release?.(); wake = null; toolEl = null;
    });
    vapi.on("speech-start", () => { setMode("speak"); setStatus("Виталик говорит"); });
    vapi.on("speech-end", () => { setMode("listen"); setStatus("Говори, я слушаю"); });
    vapi.on("volume-level", v => { if (mode === "speak") target = Math.min(1, v * 1.6); });
    vapi.on("message", m => {
      if (m.type === "transcript") {
        const role = m.role === "assistant" ? "ai" : "me";
        bubble(role, m.transcript, m.transcriptType === "partial");
        if (role === "me" && mode !== "speak") target = 0.55;
      } else if (m.type === "tool-calls") {
        setMode("tool"); setPill("Смотрю пульт", "tool"); setStatus("Лезу в пульт…");
        if (!toolEl) toolEl = sys("ph-gauge", "Смотрю ВК-Пульт…");
      } else if (toolEl && (m.type === "tool-calls-result" || m.type === "speech-update" || m.type === "model-output")) {
        toolEl.textContent = "Данные с пульта получены"; toolEl = null;
      }
    });
    vapi.on("error", fail);
  }

  muteBtn.addEventListener("click", () => {
    const on = muteBtn.getAttribute("aria-pressed") !== "true";
    vapi?.setMuted(on); muteBtn.setAttribute("aria-pressed", String(on));
    muteBtn.querySelector("i").className = on ? "ph ph-microphone-slash" : "ph ph-microphone";
    muteBtn.setAttribute("aria-label", on ? "Включить микрофон" : "Выключить микрофон");
    setStatus(on ? "Микрофон выключен" : "Говори, я слушаю");
  });
  clearBtn.addEventListener("click", () => { feed.replaceChildren(); partialEl = null; clearBtn.disabled = true; });
  $("chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (c && cfg) { buzz(10); send(c.dataset.q); } });
  $("say").addEventListener("submit", e => { e.preventDefault(); const i = $("sayInput"); send(i.value.trim()); i.value = ""; });
</script>
</body>
</html>
